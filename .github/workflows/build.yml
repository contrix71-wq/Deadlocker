name: Build DEAD LOCK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DEADLOCK.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o DEADLOCK.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
        working-directory: DEAD_LOCK_Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEAD-LOCK-APK
          path: DEAD_LOCK_Android/app/build/outputs/apk/debug/*.apk
